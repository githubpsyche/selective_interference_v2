<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1504 790" width="1504" height="790" font-family="Arial, Helvetica, sans-serif">
<rect x="0" y="0" width="1504" height="790" fill="white"/>
<defs>
  <style>
    .panel-letter { font-size:44px; font-weight:700; fill:#111111; }
    .panel-title { font-size:34px; font-weight:700; fill:#111111; }
    .condition-label { font-size:28px; font-weight:700; fill:#111111; }
    .row-label { font-size:28px; font-weight:700; fill:#111111; }
    .axis-label { font-size:23px; font-weight:700; fill:#111111; }
    .legend-label { font-size:22px; font-weight:700; fill:#3D4B5C; }
    .callout-label { font-size:21px; font-weight:700; fill:#3D4B5C; }
    .axis-line { stroke:#3D4B5C; stroke-width:3.2; stroke-linecap:square; }
    .grid-line { stroke:#D8DEE6; stroke-width:2.2; }
    .divider { stroke:#D8DEE6; stroke-width:3; }
    .callout-bracket { fill:none; stroke:#3D4B5C; stroke-width:3; stroke-linecap:square; stroke-linejoin:miter; }
    .bar-comparison { fill:#F2F4F6; stroke:#3D4B5C; stroke-width:3.2; }
    .bar-interference { fill:#FFF0E6; stroke:#D96B2B; stroke-width:3.2; }
  </style>
</defs>

<text x="18" y="60" class="panel-letter" text-anchor="start">B</text>
<g transform="translate(-68 0)">
<text x="820" y="60" class="panel-title" text-anchor="middle">Canonical selective interference effect</text>

<text x="558" y="126" class="condition-label" text-anchor="middle">No reminder</text>
<text x="1100" y="126" class="condition-label" text-anchor="middle">Film reminder</text>

<line x1="826" y1="128" x2="826" y2="714" class="divider"/>
<line x1="342" y1="414" x2="1298" y2="414" class="divider"/>

<text x="200" y="238" class="row-label" text-anchor="middle">
  <tspan x="200" dy="0">Intrusion-like</tspan>
  <tspan x="200" dy="34">film access</tspan>
</text>
<text x="200" y="556" class="row-label" text-anchor="middle">
  <tspan x="200" dy="0">Voluntary</tspan>
  <tspan x="200" dy="34">film recall</tspan>
</text>

<text x="386" y="278" class="axis-label" text-anchor="middle" transform="rotate(-90 386 278)">Film items recalled</text>
<text x="386" y="610" class="axis-label" text-anchor="middle" transform="rotate(-90 386 610)">Film items recalled</text>

<!-- Top-left cell: intrusion-like film access, no reminder -->
<line x1="412" y1="278" x2="704" y2="278" class="grid-line"/>
<line x1="412" y1="174" x2="704" y2="174" class="grid-line"/>
<line x1="412" y1="382" x2="704" y2="382" class="axis-line"/>
<line x1="412" y1="174" x2="412" y2="382" class="axis-line"/>
<rect x="466" y="274" width="112" height="108" rx="2" class="bar-comparison"/>
<rect x="578" y="288" width="112" height="94" rx="2" class="bar-interference"/>

<!-- Top-right cell: intrusion-like film access, film reminder -->
<line x1="954" y1="278" x2="1246" y2="278" class="grid-line"/>
<line x1="954" y1="174" x2="1246" y2="174" class="grid-line"/>
<line x1="954" y1="382" x2="1246" y2="382" class="axis-line"/>
<line x1="954" y1="174" x2="954" y2="382" class="axis-line"/>
<rect x="1008" y="274" width="112" height="108" rx="2" class="bar-comparison"/>
<rect x="1120" y="337" width="112" height="45" rx="2" class="bar-interference"/>
<path d="M 1008 255 L 1008 241 L 1232 241 L 1232 255" class="callout-bracket"/>
<text x="1120" y="231" class="callout-label" text-anchor="middle">selective reduction</text>

<!-- Bottom-left cell: voluntary film memory, no reminder -->
<line x1="412" y1="610" x2="704" y2="610" class="grid-line"/>
<line x1="412" y1="506" x2="704" y2="506" class="grid-line"/>
<line x1="412" y1="714" x2="704" y2="714" class="axis-line"/>
<line x1="412" y1="506" x2="412" y2="714" class="axis-line"/>
<rect x="466" y="553" width="112" height="161" rx="2" class="bar-comparison"/>
<rect x="578" y="566" width="112" height="148" rx="2" class="bar-interference"/>

<!-- Bottom-right cell: voluntary film memory, film reminder -->
<line x1="954" y1="610" x2="1246" y2="610" class="grid-line"/>
<line x1="954" y1="506" x2="1246" y2="506" class="grid-line"/>
<line x1="954" y1="714" x2="1246" y2="714" class="axis-line"/>
<line x1="954" y1="506" x2="954" y2="714" class="axis-line"/>
<rect x="1008" y="553" width="112" height="161" rx="2" class="bar-comparison"/>
<rect x="1120" y="581" width="112" height="133" rx="2" class="bar-interference"/>
<path d="M 1008 534 L 1008 520 L 1232 520 L 1232 534" class="callout-bracket"/>
<text x="1120" y="510" class="callout-label" text-anchor="middle">relative preservation</text>

<rect x="555" y="742" width="32" height="24" rx="2" fill="#F2F4F6" stroke="#3D4B5C" stroke-width="3.2"/>
<text x="601" y="762" class="legend-label" text-anchor="start">Comparison task</text>
<rect x="875" y="742" width="32" height="24" rx="2" fill="#FFF0E6" stroke="#D96B2B" stroke-width="3.2"/>
<text x="921" y="762" class="legend-label" text-anchor="start">Interference task</text>
</g>
</svg>
