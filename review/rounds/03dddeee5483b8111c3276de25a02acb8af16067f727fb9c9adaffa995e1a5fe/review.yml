  c24:
    author: Rik Henson
    date: '2026-07-25T10:11:00Z'
    status: open
    replies:
    - id: c25
      body: We don't necessarily need the "unguided film recall" terminology at all if it's
        opaque here. However, I'm not sure if "intrusions" is the right word either, because
        I feel "intrusion" has a specific connotation of disruption that doesn't fit here.
        Maybe we can replace "unguided" with something more idiomatic like "unintentional"?
      author: Gunn, Jordan
      date: '2026-07-27T09:08:00Z'
      parent_id: c24
      provenance:
        source: review/exchanges/ffd4f5e18b79896c761e622f70276ccd9fbf23670396f039e5167a9818638305.docx
        word_id: '25'
        paragraph_id: 29DD9782
        durable_id: 73F0F64F
        initials: GJ
        date_utc: '2026-07-27T08:08:00Z'
      resolved: false
    - id: c26
      body: Of course, my language here contradicts my approach to using "intrusions" elsewhere
        in the manuscript, so maybe I'm being overdefensive.
      author: Gunn, Jordan
      date: '2026-07-27T09:09:00Z'
      parent_id: c24
      provenance:
        source: review/exchanges/ffd4f5e18b79896c761e622f70276ccd9fbf23670396f039e5167a9818638305.docx
        word_id: '26'
        paragraph_id: 7C56BD08
        durable_id: 67C16765
        initials: GJ
        date_utc: '2026-07-27T08:09:00Z'
      resolved: false
    provenance:
      source: review/exchanges/ffd4f5e18b79896c761e622f70276ccd9fbf23670396f039e5167a9818638305.docx
      word_id: '24'
      paragraph_id: 7C414769
      durable_id: 7C414769
      initials: RH
  c32:
    author: Rik Henson
    date: '2026-07-25T10:12:00Z'
    status: open
    replies:
    - id: c33
      body: On the one hand, I agree that it's obvious, but on the other hand, there seems
        to be a sizable literature that misses this distinction. So I am therefore more ambivalent
        than you about how important it is to highlight this observation here and elsewhere
        in the manuscript.
      author: Gunn, Jordan
      date: '2026-07-27T09:09:00Z'
      parent_id: c32
      provenance:
        source: review/exchanges/ffd4f5e18b79896c761e622f70276ccd9fbf23670396f039e5167a9818638305.docx
