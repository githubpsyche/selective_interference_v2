<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1504 870" width="1504" height="870" font-family="Arial, Helvetica, sans-serif">
<rect x="0" y="0" width="1504" height="870" fill="white"/>
<defs>
  <style>
    .panel-letter { font-size:44px; font-weight:700; fill:#111111; }
    .panel-title { font-size:34px; font-weight:700; fill:#111111; }
    .condition-label { font-size:28px; font-weight:700; fill:#111111; }
    .row-label { font-size:28px; font-weight:700; fill:#111111; }
    .axis-label { font-size:23px; font-weight:700; fill:#111111; }
    .legend-label { font-size:22px; font-weight:700; fill:#3D4B5C; }
    .callout-label { font-size:21px; font-weight:700; fill:#3D4B5C; }
    .axis-line { stroke:#3D4B5C; stroke-width:3.2; stroke-linecap:square; }
    .grid-line { stroke:#D8DEE6; stroke-width:2.2; }
    .divider { stroke:#D8DEE6; stroke-width:3; }
    .callout-bracket { fill:none; stroke:#3D4B5C; stroke-width:3; stroke-linecap:square; stroke-linejoin:miter; }
    .bar-comparison { fill:#FFE7D5; stroke:#111111; stroke-width:3.2; }
    .bar-interference { fill:#D96B2B; stroke:#111111; stroke-width:3.2; }
  </style>
</defs>

<text x="18" y="60" class="panel-letter" text-anchor="start">A</text>
<text x="820" y="60" class="panel-title" text-anchor="middle">Canonical selective interference effect</text>

<text x="558" y="144" class="condition-label" text-anchor="middle">No reminder</text>
<text x="1100" y="144" class="condition-label" text-anchor="middle">Film reminder</text>

<line x1="826" y1="142" x2="826" y2="750" class="divider"/>
<line x1="342" y1="446" x2="1298" y2="446" class="divider"/>

<text x="200" y="258" class="row-label" text-anchor="middle">
  <tspan x="200" dy="0">Intrusion-like</tspan>
  <tspan x="200" dy="34">film access</tspan>
</text>
<text x="200" y="596" class="row-label" text-anchor="middle">
  <tspan x="200" dy="0">Voluntary</tspan>
  <tspan x="200" dy="34">film memory</tspan>
</text>

<text x="386" y="288" class="axis-label" text-anchor="middle" transform="rotate(-90 386 288)">Film items recalled</text>
<text x="386" y="626" class="axis-label" text-anchor="middle" transform="rotate(-90 386 626)">Film items recalled</text>

<!-- Top-left cell: intrusion-like film access, no reminder -->
<line x1="412" y1="304" x2="704" y2="304" class="grid-line"/>
<line x1="412" y1="192" x2="704" y2="192" class="grid-line"/>
<line x1="412" y1="416" x2="704" y2="416" class="axis-line"/>
<line x1="412" y1="192" x2="412" y2="416" class="axis-line"/>
<rect x="466" y="308" width="112" height="108" rx="2" class="bar-comparison"/>
<rect x="578" y="322" width="112" height="94" rx="2" class="bar-interference"/>

<!-- Top-right cell: intrusion-like film access, film reminder -->
<line x1="954" y1="304" x2="1246" y2="304" class="grid-line"/>
<line x1="954" y1="192" x2="1246" y2="192" class="grid-line"/>
<line x1="954" y1="416" x2="1246" y2="416" class="axis-line"/>
<line x1="954" y1="192" x2="954" y2="416" class="axis-line"/>
<rect x="1008" y="308" width="112" height="108" rx="2" class="bar-comparison"/>
<rect x="1120" y="371" width="112" height="45" rx="2" class="bar-interference"/>
<path d="M 1008 289 L 1008 275 L 1232 275 L 1232 289" class="callout-bracket"/>
<text x="1120" y="265" class="callout-label" text-anchor="middle">selective reduction</text>

<!-- Bottom-left cell: voluntary film memory, no reminder -->
<line x1="412" y1="642" x2="704" y2="642" class="grid-line"/>
<line x1="412" y1="530" x2="704" y2="530" class="grid-line"/>
<line x1="412" y1="754" x2="704" y2="754" class="axis-line"/>
<line x1="412" y1="530" x2="412" y2="754" class="axis-line"/>
<rect x="466" y="593" width="112" height="161" rx="2" class="bar-comparison"/>
<rect x="578" y="606" width="112" height="148" rx="2" class="bar-interference"/>

<!-- Bottom-right cell: voluntary film memory, film reminder -->
<line x1="954" y1="642" x2="1246" y2="642" class="grid-line"/>
<line x1="954" y1="530" x2="1246" y2="530" class="grid-line"/>
<line x1="954" y1="754" x2="1246" y2="754" class="axis-line"/>
<line x1="954" y1="530" x2="954" y2="754" class="axis-line"/>
<rect x="1008" y="593" width="112" height="161" rx="2" class="bar-comparison"/>
<rect x="1120" y="621" width="112" height="133" rx="2" class="bar-interference"/>
<path d="M 1008 574 L 1008 560 L 1232 560 L 1232 574" class="callout-bracket"/>
<text x="1120" y="550" class="callout-label" text-anchor="middle">relative preservation</text>

<rect x="555" y="805" width="32" height="24" rx="2" fill="#FFE7D5" stroke="#3D4B5C" stroke-width="3.2"/>
<text x="601" y="825" class="legend-label" text-anchor="start">Comparison task</text>
<rect x="875" y="805" width="32" height="24" rx="2" fill="#D96B2B" stroke="#3D4B5C" stroke-width="3.2"/>
<text x="921" y="825" class="legend-label" text-anchor="start">Interference task</text>
</svg>
