  <line x1="40" y1="525" x2="1640" y2="525" stroke="#D8DEE7" stroke-width="2"/>

  <!-- Panel B: shared sequence with a reminder fork -->
  <text x="38" y="595" font-size="44" font-weight="700" fill="#111111">B</text>
  <text x="840" y="595" font-size="34" font-weight="700" fill="#111111" text-anchor="middle">Context similarity during encoding</text>

  <text x="330" y="665" font-size="27" font-weight="700" fill="#3D4B5C" text-anchor="middle">Film encoding</text>
  <text x="605" y="665" font-size="27" font-weight="700" fill="#3D4B5C" text-anchor="middle">Break / delay</text>
  <text x="945" y="665" font-size="27" font-weight="700" fill="#3D4B5C" text-anchor="middle">Pre-task condition</text>
  <text x="1270" y="665" font-size="27" font-weight="700" fill="#3D4B5C" text-anchor="middle">Task encoding</text>

  <!-- Common film and delay sequence -->
  <circle cx="250" cy="840" r="27" fill="white" stroke="#1764D8" stroke-width="4"/>
  <circle cx="330" cy="840" r="27" fill="white" stroke="#1764D8" stroke-width="4"/>
  <circle cx="410" cy="840" r="27" fill="white" stroke="#1764D8" stroke-width="4"/>
  <text x="250" y="849" font-size="22" font-weight="700" fill="#1764D8" text-anchor="middle">F1</text>
  <text x="330" y="849" font-size="22" font-weight="700" fill="#1764D8" text-anchor="middle">F2</text>
  <text x="410" y="849" font-size="22" font-weight="700" fill="#1764D8" text-anchor="middle">F3</text>

  <line x1="445" y1="840" x2="500" y2="840" stroke="#3D4B5C" stroke-width="3" marker-end="url(#arrow-neutral)"/>

  <circle cx="545" cy="840" r="27" fill="#F3F4F6" stroke="#7B8490" stroke-width="4"/>
  <circle cx="625" cy="840" r="27" fill="#F3F4F6" stroke="#7B8490" stroke-width="4"/>
  <circle cx="705" cy="840" r="27" fill="#F3F4F6" stroke="#7B8490" stroke-width="4"/>
  <text x="545" y="849" font-size="22" font-weight="700" fill="#657080" text-anchor="middle">D1</text>
  <text x="625" y="849" font-size="22" font-weight="700" fill="#657080" text-anchor="middle">D2</text>
  <text x="705" y="849" font-size="22" font-weight="700" fill="#657080" text-anchor="middle">D3</text>

  <line x1="740" y1="840" x2="795" y2="840" stroke="#3D4B5C" stroke-width="3" marker-end="url(#arrow-neutral)"/>
  <circle cx="825" cy="840" r="6" fill="#3D4B5C"/>

  <!-- No-reminder branch -->
