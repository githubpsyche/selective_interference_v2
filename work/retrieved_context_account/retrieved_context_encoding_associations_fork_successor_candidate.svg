  <text x="940" y="724" font-size="25" font-weight="700" fill="#111111" text-anchor="middle">No reminder</text>

  <rect x="1120" y="720" width="60" height="48" rx="9" fill="#F3F4F6" stroke="#657080" stroke-width="3"/>
  <rect x="1240" y="720" width="60" height="48" rx="9" fill="#F3F4F6" stroke="#657080" stroke-width="3"/>
  <rect x="1360" y="720" width="60" height="48" rx="9" fill="#F3F4F6" stroke="#657080" stroke-width="3"/>
  <text x="1150" y="751" font-size="22" font-weight="700" fill="#3D4B5C" text-anchor="middle">C4</text>
  <text x="1270" y="751" font-size="22" font-weight="700" fill="#3D4B5C" text-anchor="middle">C5</text>
  <text x="1390" y="751" font-size="22" font-weight="700" fill="#3D4B5C" text-anchor="middle">C6</text>
  <line x1="1150" y1="771" x2="1150" y2="799" stroke="#A83232" stroke-width="2.5" marker-end="url(#arrow-association-small)"/>
  <line x1="1270" y1="771" x2="1270" y2="799" stroke="#A83232" stroke-width="2.5" marker-end="url(#arrow-association-small)"/>
  <line x1="1390" y1="771" x2="1390" y2="799" stroke="#A83232" stroke-width="2.5" marker-end="url(#arrow-association-small)"/>
  <circle cx="1150" cy="830" r="25" fill="white" stroke="#D96B2B" stroke-width="4"/>
  <circle cx="1270" cy="830" r="25" fill="white" stroke="#D96B2B" stroke-width="4"/>
  <circle cx="1390" cy="830" r="25" fill="white" stroke="#D96B2B" stroke-width="4"/>
  <text x="1150" y="838" font-size="22" font-weight="700" fill="#D96B2B" text-anchor="middle">T1</text>
  <text x="1270" y="838" font-size="22" font-weight="700" fill="#D96B2B" text-anchor="middle">T2</text>
  <text x="1390" y="838" font-size="22" font-weight="700" fill="#D96B2B" text-anchor="middle">T3</text>

  <!-- Reminder branch -->
  <polyline points="825,840 825,1015 900,1015" fill="none" stroke="#3D4B5C" stroke-width="3" stroke-linejoin="round"/>
  <text x="930" y="965" font-size="25" font-weight="700" fill="#111111" text-anchor="middle">Film reminder</text>
  <polygon points="950,976 990,1016 950,1056 910,1016" fill="#F1F9F4" stroke="#178A4C" stroke-width="4"/>
  <text x="950" y="1025" font-size="25" font-weight="700" fill="#178A4C" text-anchor="middle">R</text>
  <line x1="994" y1="1016" x2="1110" y2="1016" stroke="#178A4C" stroke-width="3" marker-end="url(#arrow-green)"/>
  <text x="1037" y="996" font-size="20" font-weight="700" fill="#178A4C" text-anchor="middle">MFC</text>

  <rect x="1120" y="992" width="60" height="48" rx="9" fill="#DCEBFF" stroke="#1764D8" stroke-width="4"/>
  <rect x="1240" y="992" width="60" height="48" rx="9" fill="#DCEBFF" stroke="#1764D8" stroke-width="4"/>
  <rect x="1360" y="992" width="60" height="48" rx="9" fill="#DCEBFF" stroke="#1764D8" stroke-width="4"/>
  <text x="1150" y="1023" font-size="22" font-weight="700" fill="#111111" text-anchor="middle">C4</text>
  <text x="1270" y="1023" font-size="22" font-weight="700" fill="#111111" text-anchor="middle">C5</text>
  <text x="1390" y="1023" font-size="22" font-weight="700" fill="#111111" text-anchor="middle">C6</text>
  <line x1="1150" y1="1043" x2="1150" y2="1071" stroke="#A83232" stroke-width="2.5" marker-end="url(#arrow-association-small)"/>
  <line x1="1270" y1="1043" x2="1270" y2="1071" stroke="#A83232" stroke-width="2.5" marker-end="url(#arrow-association-small)"/>
  <line x1="1390" y1="1043" x2="1390" y2="1071" stroke="#A83232" stroke-width="2.5" marker-end="url(#arrow-association-small)"/>
  <circle cx="1150" cy="1102" r="25" fill="white" stroke="#D96B2B" stroke-width="4"/>
  <circle cx="1270" cy="1102" r="25" fill="white" stroke="#D96B2B" stroke-width="4"/>
  <circle cx="1390" cy="1102" r="25" fill="white" stroke="#D96B2B" stroke-width="4"/>
  <text x="1150" y="1110" font-size="22" font-weight="700" fill="#D96B2B" text-anchor="middle">T1</text>
  <text x="1270" y="1110" font-size="22" font-weight="700" fill="#D96B2B" text-anchor="middle">T2</text>
  <text x="1390" y="1110" font-size="22" font-weight="700" fill="#D96B2B" text-anchor="middle">T3</text>
