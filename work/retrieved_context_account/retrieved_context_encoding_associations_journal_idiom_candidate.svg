    <rect class="context-cell-delay" x="34" y="0" width="27" height="33"/>
    <rect class="context-cell-film" x="68" y="0" width="27" height="33"/>
    <rect class="context-cell-delay" x="102" y="0" width="27" height="33"/>
    <text class="tiny-label" x="13.5" y="22" text-anchor="middle" fill="#4b5563">D</text>
    <text class="tiny-label" x="47.5" y="22" text-anchor="middle" fill="#4b5563">D</text>
    <text class="tiny-label" x="81.5" y="22" text-anchor="middle" fill="#245b9b">F</text>
    <text class="tiny-label" x="115.5" y="22" text-anchor="middle" fill="#4b5563">D</text>
  </g>
  <path class="timeline" d="M1430 201 L1458 201"/>
  <g transform="translate(1482 201)">
    <circle class="task-item" cx="0" cy="0" r="19"/>
    <circle class="task-item" cx="48" cy="0" r="19"/>
    <circle class="task-item" cx="96" cy="0" r="19"/>
    <text class="tiny-label" x="0" y="6" text-anchor="middle" fill="#a94819">T1</text>
    <text class="tiny-label" x="48" y="6" text-anchor="middle" fill="#a94819">T2</text>
    <text class="tiny-label" x="96" y="6" text-anchor="middle" fill="#a94819">T3</text>
  </g>

