  <g transform="translate(1285 348)">
    <rect class="context-cell-delay" x="0" y="0" width="27" height="33"/>
    <rect class="context-cell-film" x="34" y="0" width="27" height="33"/>
    <rect class="context-cell-film" x="68" y="0" width="27" height="33"/>
    <rect class="context-cell-film" x="102" y="0" width="27" height="33"/>
    <text class="tiny-label" x="13.5" y="22" text-anchor="middle" fill="#4b5563">D</text>
    <text class="tiny-label" x="47.5" y="22" text-anchor="middle" fill="#245b9b">F</text>
    <text class="tiny-label" x="81.5" y="22" text-anchor="middle" fill="#245b9b">F</text>
    <text class="tiny-label" x="115.5" y="22" text-anchor="middle" fill="#245b9b">F</text>
  </g>
  <path class="timeline" d="M1430 359 L1458 359"/>
  <g transform="translate(1482 359)">
