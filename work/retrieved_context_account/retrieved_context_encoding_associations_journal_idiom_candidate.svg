    <text class="small-label" x="50" y="7" text-anchor="middle" fill="#a94819">T2</text>
    <text class="small-label" x="100" y="7" text-anchor="middle" fill="#a94819">T3</text>
  </g>
  <text class="small-label" x="252" y="944" text-anchor="middle">Task items</text>

