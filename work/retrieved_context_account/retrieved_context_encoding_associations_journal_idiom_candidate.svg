<svg xmlns="http://www.w3.org/2000/svg" width="1680" height="1120" viewBox="0 0 1680 1120">
  <title>Retrieved-context encoding and later candidate support</title>
  <desc>
    Four-panel schematic showing bidirectional item-context memory, context at task encoding
    with and without a film reminder, weaker and stronger context-to-task learning, and the
    resulting support for film and task candidates during later memory search.
  </desc>

  <defs>
    <marker id="arrow-neutral" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L14,7 L0,14 z" fill="#4b5563"/>
    </marker>
    <marker id="arrow-blue" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L14,7 L0,14 z" fill="#2f6fbe"/>
    </marker>
    <marker id="arrow-orange" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L14,7 L0,14 z" fill="#d66a2c"/>
    </marker>

    <style>
      text {
        font-family: Arial, Helvetica, sans-serif;
        fill: #20252b;
      }
      .panel-letter {
        font-size: 42px;
        font-weight: 700;
      }
      .panel-title {
        font-size: 31px;
        font-weight: 700;
      }
      .phase-title {
        font-size: 22px;
        font-weight: 700;
        fill: #374151;
      }
      .condition {
        font-size: 23px;
        font-weight: 700;
      }
      .label {
        font-size: 21px;
      }
      .small-label {
        font-size: 18px;
      }
      .tiny-label {
        font-size: 16px;
      }
      .separator {
        stroke: #cbd5e1;
        stroke-width: 1.5;
      }
      .context-box {
        fill: #f5f7f9;
        stroke: #4b5563;
        stroke-width: 2.2;
        rx: 13;
      }
      .context-cell-film {
        fill: #dbeafe;
        stroke: #2f6fbe;
        stroke-width: 2;
        rx: 5;
      }
      .context-cell-delay {
        fill: #e5e7eb;
        stroke: #6b7280;
        stroke-width: 1.8;
        rx: 5;
      }
      .film-item {
        fill: #eef5ff;
        stroke: #2f6fbe;
        stroke-width: 2.6;
      }
      .task-item {
        fill: #fff5ee;
        stroke: #d66a2c;
        stroke-width: 2.6;
      }
      .delay-item {
        fill: #f3f4f6;
        stroke: #6b7280;
        stroke-width: 2;
      }
      .candidate-box {
        fill: none;
        stroke: #94a3b8;
        stroke-width: 1.8;
        rx: 11;
      }
      .timeline {
        fill: none;
        stroke: #64748b;
        stroke-width: 2.2;
        marker-end: url(#arrow-neutral);
      }
      .neutral-arrow {
        fill: none;
        stroke: #4b5563;
        stroke-width: 2.5;
        marker-end: url(#arrow-neutral);
      }
      .film-arrow {
        fill: none;
        stroke: #2f6fbe;
        stroke-width: 4.5;
        marker-end: url(#arrow-blue);
      }
      .task-arrow-weak {
        fill: none;
        stroke: #d66a2c;
        stroke-width: 2.7;
        marker-end: url(#arrow-orange);
      }
      .task-arrow-strong {
        fill: none;
        stroke: #d66a2c;
        stroke-width: 8;
        marker-end: url(#arrow-orange);
      }
    </style>
  </defs>

  <rect x="0" y="0" width="1680" height="1120" fill="#ffffff"/>

  <!-- Panel separators -->
  <line class="separator" x1="535" y1="38" x2="535" y2="477"/>
  <line class="separator" x1="40" y1="500" x2="1640" y2="500"/>
  <line class="separator" x1="810" y1="528" x2="810" y2="1082"/>

  <!-- Panel A -->
  <text class="panel-letter" x="42" y="72">A</text>
  <text class="panel-title" x="96" y="70">Item–context memory</text>

  <circle class="film-item" cx="150" cy="243" r="34"/>
  <text class="label" x="150" y="250" text-anchor="middle" fill="#245b9b">F<tspan baseline-shift="sub" font-size="15">i</tspan></text>
  <text class="label" x="150" y="329" text-anchor="middle">Item</text>

  <rect class="context-box" x="310" y="174" width="178" height="137"/>
  <text class="label" x="399" y="205" text-anchor="middle">Current context</text>
  <g transform="translate(330 224)">
    <rect class="context-cell-film" x="0" y="0" width="30" height="36"/>
    <rect class="context-cell-delay" x="37" y="0" width="30" height="36"/>
    <rect class="context-cell-film" x="74" y="0" width="30" height="36"/>
    <rect class="context-cell-delay" x="111" y="0" width="30" height="36"/>
    <text class="tiny-label" x="15" y="24" text-anchor="middle" fill="#245b9b">F</text>
    <text class="tiny-label" x="52" y="24" text-anchor="middle" fill="#4b5563">D</text>
    <text class="tiny-label" x="89" y="24" text-anchor="middle" fill="#245b9b">F</text>
    <text class="tiny-label" x="126" y="24" text-anchor="middle" fill="#4b5563">D</text>
  </g>
  <text class="small-label" x="399" y="292" text-anchor="middle">(C)</text>

  <path class="neutral-arrow" d="M186 214 L302 214"/>
  <path class="neutral-arrow" d="M302 273 L186 273"/>
  <text class="small-label" x="244" y="202" text-anchor="middle">
    M<tspan baseline-shift="super" font-size="13">FC</tspan>
  </text>
  <text class="small-label" x="244" y="296" text-anchor="middle">
    M<tspan baseline-shift="super" font-size="13">CF</tspan>
  </text>

  <!-- Panel B -->
  <text class="panel-letter" x="562" y="72">B</text>
  <text class="panel-title" x="616" y="70">Context at task encoding</text>

  <text class="phase-title" x="750" y="123" text-anchor="middle">Film encoding</text>
  <text class="phase-title" x="955" y="123" text-anchor="middle">Break / delay</text>
  <text class="phase-title" x="1160" y="123" text-anchor="middle">Pre-task cue</text>
  <text class="phase-title" x="1450" y="123" text-anchor="middle">Task encoding</text>

  <text class="condition" x="662" y="221" text-anchor="end">No reminder</text>
  <text class="condition" x="662" y="379" text-anchor="end">Film reminder</text>

  <!-- No-reminder lane -->
