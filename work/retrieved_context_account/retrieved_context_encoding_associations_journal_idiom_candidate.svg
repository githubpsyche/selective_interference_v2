    <text class="tiny-label" x="0" y="6" text-anchor="middle" fill="#245b9b">F1</text>
    <text class="tiny-label" x="46" y="6" text-anchor="middle" fill="#245b9b">F2</text>
    <text class="tiny-label" x="92" y="6" text-anchor="middle" fill="#245b9b">F3</text>
  </g>
  <path class="timeline" d="M1236 359 L1262 359"/>

  <rect class="context-box" x="1270" y="316" width="152" height="86"/>
