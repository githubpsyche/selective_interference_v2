  <line x1="375" y1="860" x2="420" y2="860" stroke="#3D4B5C" stroke-width="3" marker-end="url(#arrow-neutral)"/>
  <line x1="515" y1="860" x2="560" y2="860" stroke="#3D4B5C" stroke-width="3" marker-end="url(#arrow-neutral)"/>
  <line x1="655" y1="860" x2="700" y2="860" stroke="#3D4B5C" stroke-width="3" marker-end="url(#arrow-neutral)"/>
  <line x1="795" y1="860" x2="840" y2="860" stroke="#3D4B5C" stroke-width="3" marker-end="url(#arrow-neutral)"/>

  <line x1="190" y1="894" x2="190" y2="931" stroke="#1764D8" stroke-width="2.5" marker-end="url(#arrow-link-blue)"/>
