  <rect x="289" y="830" width="82" height="60" rx="12" fill="#8DB5E7" stroke="#1764D8" stroke-width="4"/>
  <rect x="429" y="830" width="82" height="60" rx="12" fill="#A3C2E7" stroke="#1764D8" stroke-width="4"/>
  <rect x="569" y="830" width="82" height="60" rx="12" fill="#B8CDE3" stroke="#617B9D" stroke-width="4"/>
