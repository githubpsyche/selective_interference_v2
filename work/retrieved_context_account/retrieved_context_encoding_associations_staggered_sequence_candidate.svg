  <polyline points="935,860 950,860 950,1040 995,1040" fill="none" stroke="#3D4B5C" stroke-width="3" stroke-linejoin="round"/>

  <!-- Reminder reinstates the same context palette shown during film encoding. -->
  <text x="1040" y="990" font-size="25" font-weight="700" fill="#111111" text-anchor="middle">Film reminder</text>
  <polygon points="1040,998 1082,1040 1040,1082 998,1040" fill="#DCEBFF" stroke="#1764D8" stroke-width="4"/>
  <text x="1040" y="1049" font-size="26" font-weight="700" fill="#1764D8" text-anchor="middle">R</text>
  <line x1="1086" y1="1040" x2="1130" y2="1040" stroke="#1764D8" stroke-width="4" marker-end="url(#arrow-blue)"/>

  <rect x="1139" y="1010" width="82" height="60" rx="12" fill="#79A9E7" stroke="#1764D8" stroke-width="4"/>
  <rect x="1279" y="1010" width="82" height="60" rx="12" fill="#8DB5E7" stroke="#1764D8" stroke-width="4"/>
  <rect x="1419" y="1010" width="82" height="60" rx="12" fill="#A3C2E7" stroke="#1764D8" stroke-width="4"/>
  <text x="1180" y="1048" font-size="25" font-weight="700" fill="#111111" text-anchor="middle">C7</text>
  <text x="1320" y="1048" font-size="25" font-weight="700" fill="#111111" text-anchor="middle">C8</text>
  <text x="1460" y="1048" font-size="25" font-weight="700" fill="#111111" text-anchor="middle">C9</text>
  <line x1="1225" y1="1040" x2="1270" y2="1040" stroke="#3D4B5C" stroke-width="3" marker-end="url(#arrow-neutral)"/>
  <line x1="1365" y1="1040" x2="1410" y2="1040" stroke="#3D4B5C" stroke-width="3" marker-end="url(#arrow-neutral)"/>

  <line x1="1180" y1="1074" x2="1180" y2="1101" stroke="#D96B2B" stroke-width="2.5" marker-end="url(#arrow-link-task)"/>
  <line x1="1320" y1="1074" x2="1320" y2="1101" stroke="#D96B2B" stroke-width="2.5" marker-end="url(#arrow-link-task)"/>
  <line x1="1460" y1="1074" x2="1460" y2="1101" stroke="#D96B2B" stroke-width="2.5" marker-end="url(#arrow-link-task)"/>
  <circle cx="1180" cy="1140" r="32" fill="white" stroke="#D96B2B" stroke-width="4"/>
  <circle cx="1320" cy="1140" r="32" fill="white" stroke="#D96B2B" stroke-width="4"/>
  <circle cx="1460" cy="1140" r="32" fill="white" stroke="#D96B2B" stroke-width="4"/>
  <text x="1180" y="1149" font-size="25" font-weight="700" fill="#D96B2B" text-anchor="middle">T1</text>
