  <circle cx="330" cy="970" r="32" fill="white" stroke="#1764D8" stroke-width="4"/>
  <circle cx="470" cy="970" r="32" fill="white" stroke="#1764D8" stroke-width="4"/>
  <circle cx="610" cy="970" r="32" fill="white" stroke="#7B8490" stroke-width="4"/>
  <circle cx="750" cy="970" r="32" fill="white" stroke="#7B8490" stroke-width="4"/>
  <circle cx="890" cy="970" r="32" fill="white" stroke="#7B8490" stroke-width="4"/>
  <text x="190" y="979" font-size="25" font-weight="700" fill="#1764D8" text-anchor="middle">F1</text>
  <text x="330" y="979" font-size="25" font-weight="700" fill="#1764D8" text-anchor="middle">F2</text>
  <text x="470" y="979" font-size="25" font-weight="700" fill="#1764D8" text-anchor="middle">F3</text>
  <text x="610" y="979" font-size="25" font-weight="700" fill="#657080" text-anchor="middle">D1</text>
  <text x="750" y="979" font-size="25" font-weight="700" fill="#657080" text-anchor="middle">D2</text>
  <text x="890" y="979" font-size="25" font-weight="700" fill="#657080" text-anchor="middle">D3</text>

  <!-- Fork after the final filler event. -->
