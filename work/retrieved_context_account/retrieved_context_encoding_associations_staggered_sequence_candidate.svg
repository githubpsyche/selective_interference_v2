<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1680 1200" width="1680" height="1200" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="arrow-neutral" markerWidth="8" markerHeight="6" refX="7.5" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#3D4B5C"/>
    </marker>
    <marker id="arrow-blue" markerWidth="8" markerHeight="6" refX="7.5" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#1764D8"/>
    </marker>
    <marker id="arrow-link-blue" markerWidth="6" markerHeight="5" refX="5.5" refY="2.5" orient="auto">
      <path d="M0,0 L6,2.5 L0,5 Z" fill="#1764D8"/>
    </marker>
    <marker id="arrow-link-gray" markerWidth="6" markerHeight="5" refX="5.5" refY="2.5" orient="auto">
      <path d="M0,0 L6,2.5 L0,5 Z" fill="#7B8490"/>
    </marker>
    <marker id="arrow-link-task" markerWidth="6" markerHeight="5" refX="5.5" refY="2.5" orient="auto">
      <path d="M0,0 L6,2.5 L0,5 Z" fill="#D96B2B"/>
