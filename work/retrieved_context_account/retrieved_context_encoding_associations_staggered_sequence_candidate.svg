  <text x="190" y="868" font-size="25" font-weight="700" fill="#111111" text-anchor="middle">C1</text>
  <text x="330" y="868" font-size="25" font-weight="700" fill="#111111" text-anchor="middle">C2</text>
  <text x="470" y="868" font-size="25" font-weight="700" fill="#111111" text-anchor="middle">C3</text>
  <text x="610" y="868" font-size="25" font-weight="700" fill="#3D4B5C" text-anchor="middle">C4</text>
  <text x="750" y="868" font-size="25" font-weight="700" fill="#3D4B5C" text-anchor="middle">C5</text>
  <text x="890" y="868" font-size="25" font-weight="700" fill="#3D4B5C" text-anchor="middle">C6</text>

