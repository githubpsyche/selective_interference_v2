  </defs>

  <rect x="0" y="0" width="1680" height="1200" fill="white"/>

  <!-- Panel A is the pre-existing Figure 3 panel, unchanged. -->
  <text x="38" y="62" font-size="44" font-weight="700" fill="#111111">A</text>
  <image href="panel_item_context_associations_no_letter.svg" x="470" y="10" width="740" height="500"/>

  <line x1="40" y1="525" x2="1640" y2="525" stroke="#D8DEE7" stroke-width="2"/>

  <!-- Panel B: a shared encoding sequence branches into the two pre-task conditions. -->
  <text x="38" y="595" font-size="44" font-weight="700" fill="#111111">B</text>
  <text x="840" y="595" font-size="34" font-weight="700" fill="#111111" text-anchor="middle">Context similarity during encoding</text>

  <!-- The task-encoding column is shared by the two branches. -->
  <text x="1320" y="655" font-size="27" font-weight="700" fill="#3D4B5C" text-anchor="middle">Task encoding</text>

  <!-- No-reminder continuation at task encoding. -->
  <text x="1035" y="695" font-size="25" font-weight="700" fill="#111111" text-anchor="middle">No reminder</text>
  <rect x="1139" y="685" width="82" height="60" rx="12" fill="#E4E7EB" stroke="#657080" stroke-width="4"/>
  <rect x="1279" y="685" width="82" height="60" rx="12" fill="#E8EAED" stroke="#657080" stroke-width="4"/>
  <rect x="1419" y="685" width="82" height="60" rx="12" fill="#ECEDEF" stroke="#657080" stroke-width="4"/>
  <text x="1180" y="723" font-size="25" font-weight="700" fill="#3D4B5C" text-anchor="middle">C7</text>
  <text x="1320" y="723" font-size="25" font-weight="700" fill="#3D4B5C" text-anchor="middle">C8</text>
  <text x="1460" y="723" font-size="25" font-weight="700" fill="#3D4B5C" text-anchor="middle">C9</text>
  <line x1="1225" y1="715" x2="1270" y2="715" stroke="#3D4B5C" stroke-width="3" marker-end="url(#arrow-neutral)"/>
  <line x1="1365" y1="715" x2="1410" y2="715" stroke="#3D4B5C" stroke-width="3" marker-end="url(#arrow-neutral)"/>

  <line x1="1180" y1="749" x2="1180" y2="786" stroke="#D96B2B" stroke-width="2.5" marker-end="url(#arrow-link-task)"/>
  <line x1="1320" y1="749" x2="1320" y2="786" stroke="#D96B2B" stroke-width="2.5" marker-end="url(#arrow-link-task)"/>
  <line x1="1460" y1="749" x2="1460" y2="786" stroke="#D96B2B" stroke-width="2.5" marker-end="url(#arrow-link-task)"/>
