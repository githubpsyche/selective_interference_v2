  <line x1="470" y1="894" x2="470" y2="931" stroke="#1764D8" stroke-width="2.5" marker-end="url(#arrow-link-blue)"/>
  <line x1="610" y1="894" x2="610" y2="931" stroke="#7B8490" stroke-width="2.5" marker-end="url(#arrow-link-gray)"/>
